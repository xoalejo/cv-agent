[project]
name = "cv-agent"
version = "1.0.0"
description = "Agente conversacional de CV compatible con el contrato Open Responses"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "openai>=1.60",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "ruff>=0.7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 95
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# B008: `Depends(...)` en argumentos por defecto es el idioma de FastAPI, no un bug.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# El perfil es contenido del CV transcrito, no lógica: partir las frases para
# respetar el ancho de línea lo haría más difícil de cotejar contra el original.
"src/infrastructure/profile_data.py" = ["E501"]
