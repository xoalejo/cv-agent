name: CI

# La suite completa corre sin red y sin secretos: los puertos de la arquitectura
# se sustituyen por dobles. Por eso este workflow no necesita ninguna credencial
# configurada en el repositorio, y puede ejecutarse también en forks.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # permite relanzarlo a mano desde la interfaz o el CLI

jobs:
  quality:
    name: Estilo y pruebas
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e ".[dev]"

      - name: Verificar estilo
        run: ruff check src tests evals

      - name: Ejecutar pruebas
        run: pytest -q

      - name: Verificar que no hay secretos en el árbol
        run: |
          if git ls-files | grep -iE '\.env$|\.pdf$|^CV/'; then
            echo "::error::Hay archivos con datos personales o secretos rastreados"
            exit 1
          fi
          echo "Sin .env ni PDFs del CV en el control de versiones"

  build:
    name: Imagen de contenedor
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Construir la imagen
        run: docker build -t cv-agent:ci .

      - name: Comprobar que arranca y responde
        run: |
          docker run -d --name cv-agent-ci -p 8080:8080 \
            -e OPENAI_API_KEY=sk-solo-para-arrancar \
            -e AGENT_API_KEY=clave-de-ci \
            cv-agent:ci

          for intento in $(seq 1 15); do
            if curl -fsS http://localhost:8080/health > /dev/null 2>&1; then
              echo "El servicio responde en /health"
              curl -fsS http://localhost:8080/health
              docker rm -f cv-agent-ci > /dev/null
              exit 0
            fi
            sleep 2
          done

          echo "::error::El contenedor no respondió en /health"
          docker logs cv-agent-ci
          docker rm -f cv-agent-ci > /dev/null
          exit 1

      - name: Comprobar que no corre como root
        run: |
          usuario=$(docker run --rm cv-agent:ci whoami)
          echo "El contenedor corre como: $usuario"
          if [ "$usuario" = "root" ]; then
            echo "::error::El contenedor no debe correr como root"
            exit 1
          fi
