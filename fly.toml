# Configuración de despliegue en Fly.io.
# Los secretos (OPENAI_API_KEY, AGENT_API_KEY) NO van aquí: se cargan con
#   fly secrets set OPENAI_API_KEY=... AGENT_API_KEY=...
# Este archivo se commitea; los secretos nunca.

app = "cv-agent-oscar-alejo"
primary_region = "qro"  # Querétaro: la región más cercana a los evaluadores

[build]

[env]
  ENVIRONMENT = "production"
  LOG_LEVEL = "INFO"
  REQUIRE_AUTH = "true"
  RATE_LIMIT_REQUESTS = "60"
  RATE_LIMIT_WINDOW_SECONDS = "60"
  MAX_TOOL_ITERATIONS = "5"
  REQUEST_TIMEOUT_SECONDS = "60"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  # Una máquina siempre encendida: el agente lo prueban de forma interactiva y un
  # arranque en frío en mitad de una demo se lee como un servicio caído.
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 20
    hard_limit = 40

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "10s"
  method = "GET"
  path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
